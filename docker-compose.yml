# FFE Trading Bot - Docker Compose
# ═══════════════════════════════════════════════════════════════════════════════
# Usage:
#   docker-compose up -d        # Start infrastructure
#   docker-compose logs -f      # View logs
#   docker-compose down         # Stop all
#   docker-compose down -v      # Stop and remove volumes (DELETES DATA!)
# ═══════════════════════════════════════════════════════════════════════════════

services:
  # ─────────────────────────────────────────────────────────────────────────────
  # MongoDB - Journal, trades history, forced events
  # ─────────────────────────────────────────────────────────────────────────────
  # mongo:
  #   image: mongo:7
  #   container_name: ffe-mongo
  #   restart: unless-stopped
  #   environment:
  #     MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-ffe}
  #     MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-ffe_secret}
  #     MONGO_INITDB_DATABASE: ${MONGO_DB_NAME:-ffe_bot}
  #   ports:
  #     - '${MONGO_PORT:-27017}:27017'
  #   volumes:
  #     - mongo_data:/data/db
  #   healthcheck:
  #     test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

  # ─────────────────────────────────────────────────────────────────────────────
  # Redis - Real-time state, rolling windows, caching
  # ─────────────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ffe-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────────────────────────────────
  # FFE Bot - Main application
  # ─────────────────────────────────────────────────────────────────────────────
  # ffe-bot:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: ffe-bot
  #   restart: unless-stopped
  #   depends_on:
  #     mongo:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #   env_file:
  #     - .env
  #   volumes:
  #     - ./logs:/app/logs
  #     - ./app:/app/src

volumes:
  redis_data:
    driver: local

networks:
  default:
    name: ffe-network
