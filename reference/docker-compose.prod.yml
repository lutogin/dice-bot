version: "3.8"

services:
  bot:
    # Pull pre-built image from Docker Hub
    image: lutogin/atlas-trading-bot:latest
    container_name: atlas-trading-bot

    # Always restart unless explicitly stopped
    restart: unless-stopped

    # Load environment variables from .env file
    env_file:
      - .env

    # Set production environment
    environment:
      NODE_ENV: production
      TZ: UTC

    # Mount volumes
    volumes:
      # Logs directory - for application logs
      - ./logs:/app/logs

    # Resource limits for production
    deploy:
      resources:
        limits:
          cpus: "1.0" # Max 1 CPU cores
          memory: 2G # Max 2GB RAM
        reservations:
          cpus: "0.5" # Min 0.5 CPU cores
          memory: 512M # Min 512MB RAM

    # Logging configuration - important for production
    logging:
      driver: "json-file"
      options:
        max-size: "50m" # Maximum log file size before rotation
        max-file: "5" # Keep 5 rotated log files
        compress: "true" # Compress rotated logs

    # Health check (optional, but recommended)
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
